[project]
name = "pine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "atria-core",
    "docling>=2.60",
    "docling-core>=2.97.0",
    "httpx>=0.28.0",
    "markdown-it-py>=3.0",
    "pandas>=2.2",
    "pydantic-ai-slim[openai]>=1.0",
    "pymupdf>=1.25",
    "rapidocr>=3.0",
]

[tool.uv.sources]
atria-core = { git = "https://github.com/atriaml/atria_core.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pine"]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "types-tqdm>=4.67.0",
]

[tool.mypy]
ignore_missing_imports = true
